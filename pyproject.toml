[project]
name = "chess-tui"
version = "0.1.0"
description = "A TUI chess app with local play"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "chess>=1.10",
]

[project.scripts]
chess-tui = "chess_tui.app:main"
chess-tui-net = "chess_tui.net_server:main"
chess-tui-engine = "chess_tui.engine_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_tui"]
include = [
    "src/chess_tui/*.py",
    "src/chess_tui/*.wav",
    "openapi/*.yaml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]